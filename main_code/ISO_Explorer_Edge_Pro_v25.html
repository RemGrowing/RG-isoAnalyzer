<script>
"use strict";

/* =========================================================
   ISO Explorer Edge Pro v10
   - Whole ISO is NOT loaded into RAM.
   - Reads only required ranges with Blob.slice().
   - Detects ISO9660 at 2048/2352/2336/2448 style offsets.
   - Parses PVD, descriptor set, Joliet, Rock Ridge, El Torito,
     path table, multi-extent files and UDF structural tags.
   - ZIP writer supports ZIP64 and can stream directly to disk
     through File System Access API on Edge.
   ========================================================= */

const SECTOR=2048;
const CHUNK=16*1024*1024;
let iso=null, fsInfo=null, currentDir=null, selected=null;
let udfRuntimePartitions=[], udfRuntimeMaps=[];
const $=id=>document.getElementById(id);
const log=(s,cls="")=>{$("log").insertAdjacentHTML("beforeend",`<div class="${cls}">${esc(String(s))}</div>`);$("log").scrollTop=$("log").scrollHeight};
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{if(n==null)return "-";let u=["B","KiB","MiB","GiB","TiB"],i=0,x=Number(n);while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?2:0)} ${u[i]}`};
const dec=new TextDecoder("latin1");
const u16=(a,o,little=true)=>new DataView(a.buffer,a.byteOffset,a.byteLength).getUint16(o,little);
const u32=(a,o,little=true)=>new DataView(a.buffer,a.byteOffset,a.byteLength).getUint32(o,little);
function both16(a,o){return [u16(a,o,true),u16(a,o,false)]}
function both32(a,o){return [u32(a,o,true),u32(a,o,false)]}
function trim0(s){return s.replace(/\0+$/,"").replace(/\s+$/,"")}
function ascii(a,o,n){return trim0(dec.decode(a.slice(o,o+n)))}
function bytesHex(a){return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
function readStr(a,o,n,encoding="latin1"){try{return trim0(new TextDecoder(encoding,{fatal:false}).decode(a.slice(o,o+n)))}catch{return trim0(dec.decode(a.slice(o,o+n)))}}
async function readAt(offset,length){
  if(offset<0||length<0||offset+length>iso.size) throw Error("範囲外の読み込み");
  if(iso?.nativePath && window.isoExplorerDesktop?.readFileRange){
    const b=await window.isoExplorerDesktop.readFileRange(iso.nativePath,offset,length);
    return b instanceof Uint8Array?b:new Uint8Array(b);
  }
  const part=iso.file.slice(offset,offset+length);
  return new Uint8Array(await part.arrayBuffer());
}
async function readSector(lba,count=1){
  return readAt((iso.dataOffset||0)+lba*iso.sectorSize,count*iso.sectorSize);
}
function parseDate17(a,o){return ascii(a,o,17)}
function safeName(s,fallback="unnamed"){s=s.replace(/\0/g,"").trim();return s||fallback}
function normalizeName(s){return s.replace(/;1$/,"").replace(/\.$/,"")||"ROOT"}

function detectPVD(buf){
  const candidates=[
    {sectorSize:2048,dataOffset:0,sector:16,idOffset:1},
    {sectorSize:2352,dataOffset:16,sector:16,idOffset:17},
    {sectorSize:2352,dataOffset:24,sector:16,idOffset:25},
    {sectorSize:2336,dataOffset:0,sector:16,idOffset:1},
    {sectorSize:2448,dataOffset:16,sector:16,idOffset:17},
    {sectorSize:2448,dataOffset:24,sector:16,idOffset:25}
  ];
  for(const c of candidates){
    const pos=c.sector*c.sectorSize+c.idOffset;
    if(pos+5<=buf.length && ascii(buf,pos,5)==="CD001") return c;
  }
  return null;
}

async function isAppleDoubleFile(file){
  if(!file || !/^\._/i.test(file.name||"")) return false;
  try{
    let b;
    if(file.nativePath && window.isoExplorerDesktop?.readFileRange){
      b=await window.isoExplorerDesktop.readFileRange(file.nativePath,0,4);
    }else if(typeof file.slice==="function"){
      b=new Uint8Array(await file.slice(0,4).arrayBuffer());
    }else{
      return false;
    }
    b=b instanceof Uint8Array?b:new Uint8Array(b);
    if(b.length<4)return false;
    const m=((b[0]*0x1000000)+(b[1]<<16)+(b[2]<<8)+b[3])>>>0;
    return m===0x00051607 || m===0x00051600;
  }catch{return false}
}

async function detectLayout(){
  if(!iso?.file || iso.size<17*2048) return null;
  const n=Math.min(32*4096,iso.size);
  const b=await readAt(0,n);
  let c=detectPVD(b);
  if(c)return c;
  for(const ss of [2048,2352,2336,2448]){
    for(const off of [0,8,16,24,32,36]){
      const pos=16*ss+off+1;
      if(pos+5<=b.length&&ascii(b,pos,5)==="CD001")
        return {sectorSize:ss,dataOffset:off,sector:16,idOffset:off+1};
    }
  }
  return null;
}

function rrParse(su){
  const out={entries:[],name:null,mode:null,uid:null,gid:null};
  let p=0;
  while(p+4<=su.length){
    const sig=String.fromCharCode(su[p],su[p+1]),len=su[p+2];
    if(!len||p+len>su.length)break;
    const x=su.slice(p,p+len);out.entries.push({sig,length:len,raw:bytesHex(x)});
    if(sig==="NM"&&len>=5){
      out.name=(out.name||"")+new TextDecoder().decode(x.slice(5));
    }else if(sig==="PX"&&len>=36){
      out.mode=both32(x,4)[0];out.uid=both32(x,20)[0];out.gid=both32(x,28)[0];
    }
    p+=len;
  }
  return out;
}

async function parseDir(extent,size,parent,depth=0){
  if(depth>64)throw Error("ディレクトリ深度上限を超えました");
  const raw=await readAt((iso.dataOffset||0)+extent*iso.sectorSize,size);
  const out=[], extentsByKey=new Map();
  let p=0;
  while(p<raw.length){
    const len=raw[p];
    if(len===0){p=((Math.floor(p/iso.sectorSize)+1)*iso.sectorSize);continue}
    if(p+len>raw.length)break;
    if(len<34){p+=len;continue}
    const flags=raw[p+25], nameLen=raw[p+32], nameBytes=raw.slice(p+33,p+33+nameLen);
    let name;
    if(nameLen===1&&(nameBytes[0]===0||nameBytes[0]===1)) name=nameBytes[0]===0?".":"..";
    else name=dec.decode(nameBytes);
    const extAttrLen=raw[p+1], lba=both32(raw,p+2)[0], size32=both32(raw,p+10)[0];
    const recDate=ascii(raw,p+18,7);
    const suStart=33+nameLen+(nameLen%2===0?1:0);
    const su=raw.slice(p+suStart+extAttrLen,p+len);
    const rr=rrParse(su);
    if(rr.name)name=rr.name;
    const isDir=!!(flags&2), multi=!!(flags&0x80);
    if(name!=="."&&name!==".."){
      const key=normalizeName(name).toLowerCase();
      let node=extentsByKey.get(key);
      if(multi&&node){
        node.extents.push({lba,size:size32});
        node.size+=size32;
        node.sectors+=Math.ceil(size32/iso.sectorSize);
      }else{
        node={name:safeName(name),rawName:dec.decode(nameBytes),type:isDir?"dir":"file",
          size:size32,startLba:lba,sectors:Math.ceil(size32/iso.sectorSize),
          flags,recordDate:recDate,extents:[{lba,size:size32}],parent,depth,rr};
        out.push(node);
        if(multi)extentsByKey.set(key,node);
      }
    }
    p+=len;
  }
  for(const n of out) if(n.type==="dir"&&n.name!=="."){
    n.children=await parseDir(n.startLba,n.size,n,depth+1);
  }
  return out;
}

async function parseDescriptors(){
  /*
   * IMPORTANT PERFORMANCE FIX:
   * The previous version performed up to 1024 separate Blob.slice()
   * operations. On Edge/Windows this can become extremely slow because
   * every slice().arrayBuffer() crosses an async boundary.
   *
   * Read the descriptor area in one contiguous operation, then parse
   * individual 2048-byte logical blocks from RAM.
   */
  const maxBlocks = Math.min(256, Math.floor((iso.size-(iso.dataOffset||0))/iso.sectorSize));
  const base = (iso.dataOffset||0) + 16*iso.sectorSize;
  const buf = await readAt(base, maxBlocks*iso.sectorSize);
  const ds=[];
  let term=false;

  for(let i=0;i<maxBlocks;i++){
    const lba=16+i, p=i*iso.sectorSize;
    const b=buf.slice(p,p+iso.sectorSize);
    if(b.length<7)break;

    const type=b[0], id=ascii(b,1,5), ver=b[6];

    // A descriptor set normally ends immediately after the terminator.
    if(id!=="CD001"){
      if(i===0) throw Error("ISO9660 PVDが見つかりません");
      continue;
    }

    const d={lba,type,id,version:ver};

    if(type===0){
      d.systemId=ascii(b,8,32);
      d.bootSystemId=ascii(b,7,32);
      d.bootCatalogLba=both32(b,71)[0];
      d.raw=bytesHex(b.slice(0,128));
    }

    if(type===1){
      d.systemId=ascii(b,8,32);
      d.volumeId=ascii(b,40,32);
      d.volumeSpace=both32(b,80)[0];
      d.logicalBlockSize=both16(b,128)[0];
      d.pathTableSize=both32(b,132)[0];
      d.lPathTable=both32(b,140)[0];
      d.mPathTable=both32(b,148)[1];
      d.root={
        extent:both32(b,158)[0],
        size:both32(b,166)[0]
      };
      d.publisher=ascii(b,318,128);
      d.preparer=ascii(b,446,128);
      d.application=ascii(b,574,128);
      d.copyright=ascii(b,702,37);
      d.abstract=ascii(b,739,37);
      d.bibliographic=ascii(b,776,37);
      d.creation=parseDate17(b,813);
      d.modification=parseDate17(b,830);
      d.expiration=parseDate17(b,847);
      d.effective=parseDate17(b,864);
      d.raw=bytesHex(b.slice(0,iso.sectorSize));
    }

    if(type===2){
      d.escape=ascii(b,88,32);
      d.systemId=ascii(b,8,32);
      d.volumeId=ascii(b,40,32);
      d.logicalBlockSize=both16(b,128)[0];
      d.volumeSpace=both32(b,80)[0];
      d.root={
        extent:both32(b,158)[0],
        size:both32(b,166)[0]
      };
      if(b[88]===0x25 && b[89]===0x2f) d.joliet=true;
      d.raw=bytesHex(b.slice(0,iso.sectorSize));
    }

    ds.push(d);

    if(type===255){
      term=true;
      break;
    }
  }

  return {descriptors:ds,terminated:term};
}

async function parsePathTable(pvd){
  const size=pvd.pathTableSize,lba=pvd.lPathTable;
  if(!size||!lba)return [];
  const b=await readAt((iso.dataOffset||0)+lba*iso.sectorSize,size);
  const out=[];let p=0,index=1;
  while(p+8<=b.length){
    const n=b[p], ext=b[p+1], extent=u32(b,p+2,true), parent=u16(b,p+6,true);
    if(!n)break;
    const name=dec.decode(b.slice(p+8,p+8+n));
    out.push({index,name,extent,parent,extendedAttributeLength:ext});
    p+=8+n+(n%2);index++;
  }
  return out;
}

async function parseElTorito(descs){
  const boot=descs.descriptors.find(x=>x.type===0);
  if(!boot||!boot.bootCatalogLba)return null;
  const b=await readSector(boot.bootCatalogLba);
  if(b[0]!==1||b[1]!==0)return {catalogLba:boot.bootCatalogLba,valid:false};
  const out={catalogLba:boot.bootCatalogLba,valid:true,platformId:b[1],entries:[]};
  for(let p=0;p+32<=b.length;p+=32){
    const type=b[p],platform=b[p+1],indicator=b[p+0];
    if(type===0x90||type===0x91||type===0x88||type===0x44||type===0x00){
      const e={offset:p,type,platform,bootable:(type===0x88),media:b[p+1],loadSegment:u16(b,p+2,true),
        sectorCount:u16(b,p+6,true),imageLba:u32(b,p+8,true)};
      if(type===0x00&&p>0&&b[p+1]===0&&b[p+2]===0)continue;
      out.entries.push(e);
    }
    if(type===0x91)break;
  }
  return out;
}

/* ---------------- UDF / ISO-13346 (ECMA-167) ---------------- */
function udfTag(a,o=0){
  return {
    id:u16(a,o,true),version:u16(a,o+2,true),checksum:a[o+4],reserved:a[o+5],
    serial:u16(a,o+6,true),crc:u16(a,o+8,true),crcLength:u16(a,o+10,true),location:u32(a,o+12,true)
  };
}
function udfLongAd(a,o){
  return {length:u32(a,o,true)&0x3fffffff,location:u32(a,o+4,true),partition:u16(a,o+8,true),impl:bytesHex(a.slice(o+10,o+16))};
}
function udfShortAd(a,o){
  return {length:u32(a,o,true)&0x3fffffff,location:u32(a,o+4,true)};
}
function udfDecodeCS0(a){
  if(!a||!a.length)return "";
  const id=a[0];
  try{
    if(id===8)return new TextDecoder("utf-8").decode(a.slice(1)).replace(/\0/g,"");
    if(id===16){
      const n=(a.length-1)&~1, b=a.slice(1,1+n);
      return new TextDecoder("utf-16be").decode(b).replace(/\0/g,"");
    }
  }catch{}
  return dec.decode(a).replace(/\0/g,"");
}
function udfMapPhysical(partitions,partRef,logicalBlock,advanced=null){
  const p=partitions.find(x=>x.number===partRef);
  if(!p)throw Error(`UDF partition reference ${partRef} が見つかりません`);
  let l=Number(logicalBlock);
  const pm=advanced?.maps?.find(x=>x.partitionNumber===partRef);
  if(pm?.type===2){
    const id=pm.identifier||'';
    if(id.includes('Virtual Partition') && pm.vatEntries){
      const v=pm.vatEntries[l];
      if(v!=null && v!==0xffffffff) l=Number(v);
    }else if(id.includes('Sparable Partition') && pm.sparing){
      const hit=pm.sparing.find(x=>x.original===l);
      if(hit) l=hit.mapped;
    }else if(id.includes('Metadata Partition') && pm.metadata){
      // Metadata files are addressed through their ICBs; the metadata partition
      // itself is a normal physical partition after its file allocation is resolved.
      if(pm.metadata.partitionStart!=null) l=pm.metadata.partitionStart+l;
    }
  }
  return p.start+l;
}
function udfExtentBytes(ad){return ad?.length||0}
function udfDescriptorName(id){return ({1:"Primary Volume Descriptor",2:"Anchor Volume Descriptor Pointer",3:"Volume Descriptor Pointer",4:"Implementation Use Volume Descriptor",5:"Partition Descriptor",6:"Logical Volume Descriptor",7:"Unallocated Space Descriptor",8:"Terminating Descriptor",9:"Logical Volume Integrity Descriptor",256:"File Set Descriptor",257:"File Identifier Descriptor",261:"File Entry",266:"Extended File Entry"})[id]||`Tag ${id}`}

async function detectUdfLayout(){
  const layouts=[];
  for(const ss of [2048,2352,2336,2448]) for(const off of [0,8,16,24,32,36]) layouts.push({sectorSize:ss,dataOffset:off});
  for(const c of layouts){
    const total=Math.floor((iso.size-c.dataOffset)/c.sectorSize);
    if(total<=0)continue;
    const candidates=new Set([256]);
    for(const delta of [0,1,2,3,4,5,16,256]){
      if(total-1-delta>=0)candidates.add(total-1-delta);
      if(total-256-delta>=0)candidates.add(total-256-delta);
      if(total-257+delta>=0)candidates.add(total-257+delta);
    }
    for(const lba of candidates){
      const pos=c.dataOffset+lba*c.sectorSize;
      if(pos<0||pos+16>iso.size)continue;
      const b=await readAt(pos,16);
      if(u16(b,0,true)===2&&u32(b,12,true)===lba) return {...c,sector:lba,idOffset:c.dataOffset};
    }
  }
  // Bounded fallback scan. Never loads more than 4 MiB per scan.
  const scanBytes=4*1024*1024;
  for(const c of layouts){
    const total=Math.floor((iso.size-c.dataOffset)/c.sectorSize);
    if(total<=0)continue;
    const blocks=Math.max(1,Math.floor(scanBytes/c.sectorSize));
    const ranges=[{start:0,count:Math.min(total,blocks)}];
    const lastStart=Math.max(0,total-blocks);
    if(lastStart!==0)ranges.push({start:lastStart,count:total-lastStart});
    for(const r of ranges){
      const buf=await readAt(c.dataOffset+r.start*c.sectorSize,r.count*c.sectorSize);
      for(let i=0;i<r.count;i++){
        const p=i*c.sectorSize;
        if(u16(buf,p,true)!==2)continue;
        const loc=u32(buf,p+12,true);
        if(loc===r.start+i)return {...c,sector:loc,idOffset:c.dataOffset};
      }
    }
  }
  return null;
}

async function parseUdfAdvancedMaps(descriptors,partitions,lvd){
  const maps=[];
  if(!lvd?.partitionMaps)return maps;
  for(const m of lvd.partitionMaps){
    const x={...m,advanced:true};
    if(m.type!==2){maps.push(x);continue;}
    const id=m.identifier||'';
    const part=partitions.find(p=>p.number===m.partitionNumber);
    if(id.includes('Virtual Partition')){
      x.kind='virtual';x.vatEntries=null;x.vatLba=null;
      if(part){
        const vatLba=part.start+part.length-1;
        try{
          const b=await readAt(iso.dataOffset+vatLba*iso.sectorSize,iso.sectorSize);
          const pos=b.indexOf(new TextEncoder().encode('*UDF Virtual Alloc Tbl'));
          if(pos>=0){
            x.vatLba=vatLba;
            const prev=u32(b,pos+24,true);
            const start=Math.max(0,pos+36);
            const entries=[];
            for(let q=start;q+4<=b.length;q+=4)entries.push(u32(b,q,true));
            x.vatEntries=entries;
            x.previousVATICBLoc=prev;
            x.vatRevision=entries.length?'1.50/2.50+':'unknown';
          }
        }catch(e){x.warning=`VAT読取失敗: ${e.message}`}
      }
    }else if(id.includes('Sparable Partition')){
      x.kind='sparable';x.sparing=[];
      const locs=Array.isArray(m.sparingLocations)?m.sparingLocations:[];
      for(const loc of locs.slice(0,4)){
        try{
          const b=await readAt(iso.dataOffset+Number(loc)*iso.sectorSize,iso.sectorSize);
          const sig=dec.decode(b.slice(1,1+Math.min(24,b.length-1))).replace(/\\0/g,'');
          if(sig.includes('Sparing Table')||b.indexOf(new TextEncoder().encode('*UDF Sparing Table'))>=0){
            const n=u16(b,48,true), base=56;
            for(let i=0;i<n && base+i*8+8<=b.length;i++){
              const original=u32(b,base+i*8,true),mapped=u32(b,base+i*8+4,true);
              if(original!==0xffffffff) x.sparing.push({original,mapped});
            }

function makeByteEntry(name, bytes){
  const b=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  return {type:"bytes",name,size:b.byteLength,readChunk:async(pos,take)=>b.slice(pos,pos+take)};
}
function makeIsoChunkEntry(index, offset, size){
  const name=`__ISO_RECOVERY__/chunks/chunk_${String(index).padStart(6,"0")}.bin`;
  return {type:"raw",name,size,readChunk:async(pos,take)=>{
    return readAt(offset+pos,take);
  }};
}
function entryName(e){return e.name||zipName(e)}
function entrySize(e){return Number(e.size||0)}
function makeRecoveryEntries(){
  const chunkSize=CHUNK;
  const size=iso.file.size;
  const count=Math.ceil(size/chunkSize);
  const entries=[];
  for(let i=0;i<count;i++){
    const offset=i*chunkSize;
    const n=Math.min(chunkSize,size-offset);
    entries.push(makeIsoChunkEntry(i,offset,n));
  }
  return {chunkSize,count,entries};
}

async function makeZipStream(entries,label,directoryHandle=null){
  if(!entries.length)throw Error("ZIP対象がありません");
  const writerInfo=await chooseZipWriter(label,directoryHandle);
  if(!writerInfo){await makeZipBlobFallback(entries,label);return}
  const w=writerInfo.writer;
  const central=[];
  let offset=0n;
  let total=0n;
  for(const n of entries) if(!n.deferredSize) total+=BigInt(entrySize(n));
  if(total===0n && !entries.some(n=>n.deferredSize))throw Error("ZIP対象データがありません");

  let done=0n,index=0;
  let lastProgress=performance.now();
  const fileCount=entries.length;
  try{
    log(`ZIPストリーム作成開始: ${entries.length} entries / 合計 ${fmt(total)}`,"ok");
    for(const n of entries){
      if(typeof n.prepare==="function") await n.prepare();
      const name=entryName(n), size=BigInt(entrySize(n));
      if(n.deferredSize) total+=size;
      const zip64=size>=0xffffffffn||offset>=0x100000000n;
      const local=zipLocalHeader(name,0,size,zip64);
      await w.write(local);
      const localOffset=offset;
      offset+=BigInt(local.length);

      let crc=0xffffffff>>>0;
      let remaining=Number(size),pos=0;
      while(remaining>0){
        const take=Math.min(CHUNK,remaining);
        const b=await n.readChunk(pos,take);
        if(!b||b.byteLength!==take)throw Error(`データ長不一致: ${name} (${take} bytes要求 / ${b?.byteLength??0} bytes取得)`);
        crc=crc32Step(crc,b);
        await w.write(b);
        pos+=take;remaining-=take;done+=BigInt(take);offset+=BigInt(take);
        const nowPerf=performance.now();
        if(nowPerf-lastProgress>=120||done===total){
          setZipProgress(Number(done),Number(total),`ZIP作成中: ${index+1} / ${fileCount} エントリ`);
          lastProgress=nowPerf;
        }
      }
      crc=crc32Finish(crc);
      const dd=zipDataDescriptor(crc,size,zip64);
      await w.write(dd);offset+=BigInt(dd.length);
      central.push({name,crc,size,offset:localOffset,zip64});
      index++;
      log(`完了: ${name} (${fmt(size)}) CRC32=${crc.toString(16).padStart(8,"0")}`);
    }

    const centralOffset=offset;
    let centralSize=0n;
    const cdParts=[];
    for(const r of central){
      const c=zipCentralHeader(r.name,r.crc,r.size,r.offset,r.zip64);
      cdParts.push(c);centralSize+=BigInt(c.length);
    }
    for(const c of cdParts)await w.write(c);
    offset+=centralSize;

    const archiveNeedsZip64=central.length>=0xffff||centralOffset>=0x100000000n||centralSize>=0x100000000n||central.some(r=>r.zip64);
    if(archiveNeedsZip64){
      const z=makeZip64End(central.length,centralSize,centralOffset);
      await w.write(z.e);await w.write(z.loc);await w.write(z.end);
      offset+=BigInt(z.e.length+z.loc.length+z.end.length);
    }else{
      const end=concat(w32(0x06054b50),w16(0),w16(0),w16(central.length),w16(central.length),w32(Number(centralSize)),w32(Number(centralOffset)),w16(0));
      await w.write(end);offset+=BigInt(end.length);
    }
    await w.close();
    $("status").innerHTML=`<b>ZIP保存完了</b><br>${fmt(Number(done))} のデータを書き出しました。<br>出力: ${esc(label)} / ZIPサイズ: ${fmt(Number(offset))}`;
    log(`ZIP保存完了: ${label} (${fmt(Number(offset))})`,"ok");
  }catch(e){
    try{await w.abort()}catch{}
    throw e;
  }
}

/*
 * v17 lossless filesystem reader
 *
 * IMPORTANT FIX:
 * A ZIP writer requests data in large chunks (16 MiB), but a filesystem
 * file may be split across multiple allocation extents.  The old reader
 * returned only the remainder of the current extent.  That made a perfectly
 * valid request such as 16 MiB become e.g. 15 MiB at an extent boundary,
 * causing makeZipStream() to abort.  Windows install.wim exposed this first.
 *
 * This reader now walks ALL extents touched by the requested [pos,pos+take)
 * range and concatenates them.  It also validates the logical file size
 * against the extent table and emits detailed diagnostics on malformed data.
 */
async function readNodeRangeV17(n,pos,take){
  pos=Number(pos);take=Number(take);
  if(!Number.isSafeInteger(pos)||!Number.isSafeInteger(take)||pos<0||take<0)
    throw Error(`不正なファイル範囲: ${n.name} pos=${pos} take=${take}`);
  if(take===0)return new Uint8Array(0);

  const fileSize=Number(n.size??0);
  if(!Number.isSafeInteger(fileSize)||fileSize<0)
    throw Error(`不正なファイルサイズ: ${n.name} size=${n.size}`);
  if(pos+take>fileSize)
    throw Error(`ファイル範囲超過: ${n.name} pos=${pos} take=${take} size=${fileSize}`);

  if(n.embeddedData){
    const end=pos+take;
    const b=n.embeddedData.slice(pos,end);
    if(b.byteLength!==take)
      throw Error(`embeddedデータ長不一致: ${n.name} (${take} bytes要求 / ${b.byteLength} bytes取得)`);
    return b instanceof Uint8Array?b:new Uint8Array(b);
  }

  const extents=Array.isArray(n.extents)?n.extents:[];
  if(!extents.length){
    throw Error(`ファイルextentがありません: ${n.name} size=${fileSize}`);
  }

  // Normalize extent lengths once per request.  Keep zero-length extents out
  // of the address calculation but retain their index for diagnostics.
  const ex=[];
  let extentTotal=0;
  for(let i=0;i<extents.length;i++){
    const e=extents[i];
    const len=Number(e?.length??e?.size??0);
    if(!Number.isSafeInteger(len)||len<0)
      throw Error(`不正なextent長: ${n.name} extent#${i} length=${e?.length}`);
    ex.push({...e,__index:i,__start:extentTotal,__length:len});
    extentTotal+=len;
  }

  if(extentTotal<fileSize){
    const detail=ex.map(e=>`#${e.__index}:len=${e.__length},LBA=${e.physicalLba??e.lba??"?"},part=${e.partition??"?"},logical=${e.logicalLba??"?"}`).join(" | ");
    throw Error(`UDF/FS extent総量不足: ${n.name} fileSize=${fileSize} extentTotal=${extentTotal} extentCount=${ex.length} :: ${detail}`);
  }

  const wantedEnd=pos+take;
  const parts=[];
  let cursor=pos;
  let remaining=take;

  for(const e of ex){
    const start=e.__start,end=start+e.__length;
    if(cursor>=end)continue;
    if(cursor<start)break;
    if(e.__length===0)continue;

    const local=cursor-start;
    const want=Math.min(remaining,e.__length-local);
    if(want<=0)continue;

    const physicalLba=Number(e.physicalLba??e.lba);
    if(!Number.isSafeInteger(physicalLba)||physicalLba<0){
      throw Error(`extent物理LBAを解決できません: ${n.name} extent#${e.__index} physicalLba=${e.physicalLba} lba=${e.lba}`);
    }

    // Embedded extents are already handled above.  Normal extents point to
    // a physical sector/LBA.  local may be non-sector-aligned, which is valid.
    const byteOffset=(iso.dataOffset||0)+physicalLba*iso.sectorSize+local;
    const b=await readAt(byteOffset,want);
    if(!b||b.byteLength!==want){
      throw Error(`extentデータ長不一致: ${n.name} extent#${e.__index} filePos=${cursor} local=${local} physicalLba=${physicalLba} (${want} bytes要求 / ${b?.byteLength??0} bytes取得)`);
    }
    parts.push(b);
    cursor+=want;
    remaining-=want;
    if(remaining===0)break;
  }

  if(remaining!==0 || cursor!==wantedEnd){
    const detail=ex.map(e=>`#${e.__index}:start=${e.__start},len=${e.__length},LBA=${e.physicalLba??e.lba??"?"}`).join(" | ");
    throw Error(`ファイルextent範囲を完全に解決できません: ${n.name} pos=${pos} take=${take} remaining=${remaining} :: ${detail}`);
  }
  return parts.length===1?parts[0]:concat(...parts);
}

function fileEntryFromNode(n){
  return {
    type:"file",
    name:zipName(n),
    size:Number(n.size??0),
    readChunk:(pos,take)=>readNodeRangeV17(n,pos,take)
  };
}

async function zipNodes(nodes,name,includeRecovery=false,directoryHandle=null){
  const files=[];
  function collect(n){if(n.type==="file")files.push(fileEntryFromNode(n));else if(n.children)for(const c of n.children)collect(c)}
  for(const n of nodes)collect(n);
  if(!files.length)throw Error("ファイルがありません");
  if(includeRecovery){
    const rec=makeRecoveryEntries();
    const info={
      format:"ISO Explorer Edge Pro Recovery Chunks",
      version:2,
      originalName:iso.file.name,
      originalSize:iso.file.size,
      chunkSize:rec.chunkSize,
      chunkCount:rec.count,
      sourceLayout:{sectorSize:iso.sectorSize,dataOffset:iso.dataOffset},
      reconstruction:"chunksをindex順に連結して元ファイルを再構築する。chunksはISO/IMG/BIN元ファイル全体を先頭バイトから保存しているため、解析対象外領域・padding・予約領域・未知領域も保持される。",
      generatedAt:new Date().toISOString(),
      gpuAcceleration:await prepareRecoveryMetadata()
    };
    files.push(...rec.entries);
    files.push(makeByteEntry("__ISO_RECOVERY__/manifest.json",new TextEncoder().encode(JSON.stringify(info,null,2))));
    log(`復元用チャンク追加: ${rec.count} 個 / ${fmt(iso.file.size)}`,"ok");
  }
  await makeZipStream(files,name,directoryHandle);
}

/* Small-archive fallback only. Large ZIPs intentionally never use Blob assembly. */
async function saveBlob(blob,name){
  if(canUseSaveFilePicker()){
    const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:"ZIP archive",accept:{"application/zip":[".zip"]}}]});
    const w=await h.createWritable();await w.write(blob);await w.close();log(`保存完了: ${name}`,"ok");return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}

/* ---------------- Analysis ZIP ---------------- */
function jsonBlob(x){
  const seen=new WeakSet();
  const clean=(key,value)=>{
    if(key==="parent"||key==="embeddedData")return undefined;
    if(typeof Blob!=="undefined"&&value instanceof Blob)return undefined;
    if(typeof File!=="undefined"&&value instanceof File)return undefined;
    if(typeof ArrayBuffer!=="undefined"&&value instanceof ArrayBuffer)return undefined;
    if(typeof ArrayBuffer!=="undefined"&&ArrayBuffer.isView(value))return undefined;
    if(typeof value==="object"&&value!==null){if(seen.has(value))return undefined;seen.add(value)}
    return value;
  };
  return new Blob([JSON.stringify(x,clean,2)],{type:"application/json;charset=utf-8"});
}
function makeAnalysisEntries(){
  const a=[];
  const summary={
    tool:"ISO Explorer Edge Pro v20 GPU Accelerator + UDF Detection + Extent Reader Fix",file:iso.file.name,size:iso.size,
    sectorSize:iso.sectorSize,dataOffset:iso.dataOffset,filesystem:fsInfo.filesystem,
    volume:fsInfo.pvd,descriptorCount:fsInfo.descriptors.length,
    entryCount:flatten(fsInfo.root.children||[]).length,generatedAt:new Date().toISOString()
  };
  a.push(["json/analysis_summary.json",jsonBlob(summary)]);
  a.push(["json/iso9660_descriptors.json",jsonBlob(fsInfo.descriptors)]);
  a.push(["json/iso9660_path_table.json",jsonBlob(fsInfo.path)]);
  a.push(["json/eltorito.json",jsonBlob(fsInfo.eltorito)]);
  a.push(["json/joliet.json",jsonBlob(fsInfo.joliet)]);
  a.push(["json/udf_structure.json",jsonBlob(fsInfo.udf)]);
  if(fsInfo.udf?.detected)a.push(["json/udf_descriptors.json",jsonBlob(fsInfo.udf.descriptors)]);
  const sectorMap=flatten(fsInfo.root.children||[]).map(n=>({path:pathOf(n),type:n.type,size:n.size,startLba:n.startLba,sectors:n.sectors,extents:n.extents}));
  a.push(["json/iso9660_sector_map.json",jsonBlob(sectorMap)]);
  a.push(["json/rock_ridge.json",jsonBlob(flatten(fsInfo.root.children||[]).filter(n=>n.rr&&n.rr.entries.length).map(n=>({path:pathOf(n),rockRidge:n.rr})))]);
  if(fsInfo.pvd){const raw16=readSector(16);a.push(["raw/sector_16_pvd.bin",raw16]);}
  const base=(iso.dataOffset||0)+16*iso.sectorSize;
  const avail=Math.max(0,iso.size-base);
  const vd=readAt(base,Math.min(32*iso.sectorSize,avail));
  a.push(["raw/descriptor_area_first_32_sectors.bin",vd]);
  if(fsInfo.udf?.anchors?.length){
    fsInfo.udf.anchors.forEach((anchor,i)=>{
      if(anchor?.lba!=null)a.push([`raw/udf_anchor_${String(i).padStart(2,"0")}_lba_${anchor.lba}.bin`,readSector(anchor.lba)]);
    });
  }
  return a;
}
async function resolveAnalysisEntries(){
  const a=makeAnalysisEntries();
  const out=[];
  for(const [name,data] of a){
    const value=(data&&typeof data.then==="function")?await data:data;
    const size=Number(value?.size??value?.byteLength??0);
    if(!Number.isFinite(size)||size<0)throw Error(`解析データサイズを取得できません: ${name}`);
    out.push({
      name,type:"bytes",size,
      readChunk:async(pos,take)=>{
        const part=value.slice(pos,pos+take);
        if(part&&typeof part.arrayBuffer==="function")return new Uint8Array(await part.arrayBuffer());
        if(part instanceof Uint8Array)return part;
        if(ArrayBuffer.isView(part))return new Uint8Array(part.buffer,part.byteOffset,part.byteLength);
        if(part instanceof ArrayBuffer)return new Uint8Array(part);
        throw Error(`解析データのチャンク型が未対応です: ${name}`);
      }
    });
  }
  return out;
}
async function analysisZip(directoryHandle=null,outputName=null){
  const files=await resolveAnalysisEntries();
  await makeZipStream(files,outputName||iso.file.name.replace(/\.[^.]+$/,"")+"_analysis.zip",directoryHandle);
}

async function makeContentsEntries(){
  const files=[];
  function collect(n){if(n.type==="file")files.push(fileEntryFromNode(n));else if(n.children)for(const c of n.children)collect(c)}
  for(const n of fsInfo.root.children||[])collect(n);
  if(!files.length)throw Error("ファイルがありません");

  /*
   * PERFORMANCE:
   * Recovery metadata used to force a complete extra pass over the ISO
   * before the recovery chunks themselves were written.  That meant the
   * raw ISO was read twice.  Keep the same recovery information, but collect
   * it while the recovery chunks are being streamed into the ZIP.
   */
  const rec=makeRecoveryEntries();
  const metrics=new Array(rec.count), sizes=new Array(rec.count);
  const seen=new Map();
  let metricMode="CPU";
  let gpuOK=null;
  let pendingBase=0, pendingChunks=[], pendingSizes=[];
  const flushMetrics=async()=>{
    if(!pendingChunks.length)return;
    if(gpuOK===null)gpuOK=await GPU_ACCEL.init();
    let ms=null;
    if(gpuOK&&GPU_ACCEL.available){
      try{ms=await GPU_ACCEL.process(pendingChunks);if(ms)metricMode="GPU(WebGPU)";}
      catch(e){GPU_ACCEL.available=false;GPU_ACCEL.reason=e?.message||String(e);log(`GPU処理失敗、CPUへフォールバック: ${GPU_ACCEL.reason}`,'warn');}
    }
    if(!ms)ms=pendingChunks.map(cpuChunkFingerprint);
    for(let j=0;j<ms.length;j++)metrics[pendingBase+j]=ms[j];
    pendingChunks=[];pendingSizes=[];
  };

  const recoveryEntries=rec.entries.map((entry,i)=>({
    ...entry,
    readChunk:async(pos,take)=>{
      const b=await entry.readChunk(pos,take);
      // Recovery entries are read sequentially by makeZipStream, so each
      // complete chunk is observed exactly once here.
      if(pos===0){
        sizes[i]=take;
        pendingBase=i;
        pendingChunks=[b];
        pendingSizes=[take];
      }else{
        // This should not occur with the recovery entry writer, but preserve
        // correctness if a future writer requests a chunk in pieces.
        pendingChunks.push(b);pendingSizes.push(take);
      }
      return b;
    }
  }));

  /* The metrics need to be finalized after each recovery entry.  We do that
     with a wrapper entry so ZIP streaming remains unchanged. */
  const wrapped=[];
  for(let i=0;i<recoveryEntries.length;i++){
    const e=recoveryEntries[i];
    wrapped.push({...e,readChunk:async(pos,take)=>{
      const b=await e.readChunk(pos,take);
      if(pos+take===e.size){
        await flushMetrics();
      }
      return b;
    }});
  }

  // Generate the manifest only after all recovery chunks have been streamed.
  // makeZipStream processes entries in order, so the manifest is naturally
  // written last and contains the exact same metadata as the old path.
  const manifestEntry={
    type:"bytes",name:"__ISO_RECOVERY__/manifest.json",size:0,deferredSize:true,_bytes:null,
    prepare:async()=>{
      const rows=[],seenNow=new Map();
      for(let i=0;i<rec.count;i++){
        const m=metrics[i];
        if(!m)throw Error(`Recovery fingerprint未生成: chunk ${i}`);
        const key=fingerprintKey(sizes[i],m),prev=seenNow.get(key);
        if(prev==null)seenNow.set(key,i);
        rows.push({index:i,size:sizes[i],crc32:hex32(m.crc32),hash128:m.hash128.map(hex32).join(""),duplicateOf:prev==null?null:prev});
      }
      const info={
        format:"ISO Explorer Edge Pro Recovery Chunks",
        version:2,
        originalName:iso.file.name,
        originalSize:iso.file.size,
        chunkSize:rec.chunkSize,
        chunkCount:rec.count,
        sourceLayout:{sectorSize:iso.sectorSize,dataOffset:iso.dataOffset},
        reconstruction:"chunksをindex順に連結して元ファイルを再構築する。chunksはISO/IMG/BIN元ファイル全体を先頭バイトから保存しているため、解析対象外領域・padding・予約領域・未知領域も保持される。",
        generatedAt:new Date().toISOString(),
        gpuAcceleration:{chunkSize:rec.chunkSize,count:rec.count,mode:metricMode,metrics:rows,duplicateCount:rows.filter(x=>x.duplicateOf!=null).length,hashAlgorithm:"128-bit FNV-derived fingerprint (non-cryptographic)"}
      };
      manifestEntry._bytes=u8str(JSON.stringify(info,null,2));
      manifestEntry.size=manifestEntry._bytes.byteLength;
      manifestEntry.deferredSize=false;
    },
    readChunk:async(pos,take)=>manifestEntry._bytes.slice(pos,pos+take)
  };
  wrapped.push(manifestEntry);
  log(`復元用チャンク追加: ${rec.count} 個 / ${fmt(iso.file.size)}（フィンガープリントはチャンク書き出し時に同時生成）`,'ok');
  return files.concat(wrapped);
}
/* ---------------- Parallel batch isolation ----------------
 * Each batch job runs in its own hidden iframe.  This is intentional:
 * analyze()/zipNodes() use module-level state (iso/fsInfo/UDF runtime), so
 * Promise.all() in the main renderer would race and corrupt another job.
 * The iframe gives every job an independent JS global scope while keeping
 * the existing single-ISO code path unchanged.

let parallelBatchRelayInstalled=false;
const parallelBatchWriters=new Map();
let parallelBatchRpcSeq=0;

function parallelBatchDecodeCore(){
  const bin=atob(PARALLEL_BATCH_CORE_B64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function parallelBatchError(e){return {message:e?.message||String(e),stack:e?.stack||String(e)}}
function installParallelBatchRelay(){
  if(parallelBatchRelayInstalled)return;
  parallelBatchRelayInstalled=true;
  window.addEventListener("message",async ev=>{
    const d=ev.data;
    if(!d||d.type!=="ISO_EXPLORER_BATCH_RPC")return;
    const reply=(payload,transfer=[])=>{try{ev.source?.postMessage({type:"ISO_EXPLORER_BATCH_RPC_RESULT",rpcId:d.rpcId,...payload},"*",transfer)}catch(e){try{ev.source?.postMessage({type:"ISO_EXPLORER_BATCH_RPC_RESULT",rpcId:d.rpcId,ok:false,error:parallelBatchError(e)},"*")}catch{}}};
    try{
      const api=window.isoExplorerDesktop;
      if(!api)throw Error("Electron native APIが見つかりません。");
      let result;
      if(d.method==="readFileRange"){
        result=await api.readFileRange(d.args.path,d.args.offset,d.args.length);
        const u=result instanceof Uint8Array?result:new Uint8Array(result);
        const out=u.byteOffset===0&&u.byteLength===u.buffer.byteLength?u:new Uint8Array(u);
        return reply({ok:true,value:out},[out.buffer]);
      }
      if(d.method==="nativeFingerprint"){
        result=await api.nativeFingerprint(d.args.path,d.args.chunkSize);
        return reply({ok:true,value:result});
      }
      if(d.method==="createZipWriter"){
        result=await api.createZipWriter(d.args.root,d.args.relativeDir,d.args.name,d.args.saveDialog);
        if(!result) return reply({ok:true,value:null});
        const writerId=`${Date.now()}_${++parallelBatchRpcSeq}`;
        parallelBatchWriters.set(writerId,{source:ev.source,writer:result});
        return reply({ok:true,value:{__nativeWriterId:writerId}});
      }
      if(d.method==="writerWrite"||d.method==="writerClose"||d.method==="writerAbort"){
        const rec=parallelBatchWriters.get(d.args.writerId);
        if(!rec||rec.source!==ev.source)throw Error("無効なZIP writerです。");
        if(d.method==="writerWrite"){
          const u=d.args.data instanceof Uint8Array?d.args.data:new Uint8Array(d.args.data);
          result=await rec.writer.write(u);
        }else if(d.method==="writerClose"){
          result=await rec.writer.close();parallelBatchWriters.delete(d.args.writerId);
        }else{
          try{result=await rec.writer.abort()}finally{parallelBatchWriters.delete(d.args.writerId)}
        }
        return reply({ok:true,value:result===undefined?null:result});
      }
      throw Error(`未対応のnative RPC: ${d.method}`);
    }catch(e){return reply({ok:false,error:parallelBatchError(e)})}
  });
}
function parallelBatchWorkerHTML(nativeMode){
  const core=parallelBatchDecodeCore();
  const proxy=nativeMode?`window.isoExplorerDesktop={electron:true,readFileRange:(path,offset,length)=>rpc("readFileRange",{path,offset,length}),nativeFingerprint:(path,chunkSize)=>rpc("nativeFingerprint",{path,chunkSize}),createZipWriter:(root,relativeDir,name,saveDialog)=>rpcWriter("createZipWriter",{root,relativeDir,name,saveDialog})};\nfunction rpc(method,args){return new Promise((resolve,reject)=>{const rpcId="rpc_"+Date.now()+"_"+(++rpcSeq);pending.set(rpcId,{resolve,reject});const msg={type:"ISO_EXPLORER_BATCH_RPC",rpcId,method,args};parent.postMessage(msg,"*");});}\nfunction rpcWriter(method,args){return rpc(method,args).then(v=>v?{write:data=>rpc("writerWrite",{writerId:v.__nativeWriterId,data}),close:()=>rpc("writerClose",{writerId:v.__nativeWriterId}),abort:()=>rpc("writerAbort",{writerId:v.__nativeWriterId})}:null)}\nconst pending=new Map();let rpcSeq=0;window.addEventListener("message",ev=>{const d=ev.data;if(d?.type!=="ISO_EXPLORER_BATCH_RPC_RESULT")return;const p=pending.get(d.rpcId);if(!p)return;pending.delete(d.rpcId);if(d.ok){p.resolve(d.value)}else{const e=Error(d.error?.message||"native RPC failed");e.stack=d.error?.stack||e.stack;p.reject(e)}});`:`const pending=new Map();let rpcSeq=0;`;
  const boot='<!doctype html><html><body><pre id="log"></pre><div id="status"></div><script>"use strict";'+proxy+'\n'+core+'\nwindow.addEventListener("message",async ev=>{const d=ev.data;if(!d||d.type!=="ISO_EXPLORER_BATCH_RUN")return;try{iso=d.iso;fsInfo=null;currentDir=null;selected=null;udfRuntimePartitions=[];udfRuntimeMaps=[];recoveryMetaCache=null;if(d.nativeMode){/* proxy already installed */}else{window.isoExplorerDesktop=undefined;}const fi=await analyze();fsInfo=fi;await analysisZip(d.directoryHandle||null,d.base+"_analysis.zip");await zipNodes(fi.root.children||[],d.base+"_contents.zip",true,d.directoryHandle||null);parent.postMessage({type:"ISO_EXPLORER_BATCH_DONE",jobId:d.jobId,ok:true},"*");}catch(e){parent.postMessage({type:"ISO_EXPLORER_BATCH_DONE",jobId:d.jobId,ok:false,error:{message:e?.message||String(e),stack:e?.stack||String(e)}},"*");}});<\/script></body></html>';

  return boot;
}
function runParallelBatchJob(job){
  installParallelBatchRelay();
  return new Promise((resolve,reject)=>{
    const frame=document.createElement("iframe");
    frame.style.cssText="position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;border:0;opacity:0;pointer-events:none";
    frame.setAttribute("aria-hidden","true");
    const nativeMode=!!job.nativeMode;
    frame.srcdoc=parallelBatchWorkerHTML(nativeMode);
    const timeout=setTimeout(()=>{cleanup();reject(Error("並列バッチ処理がタイムアウトしました。"))},24*60*60*1000);
    const onMessage=ev=>{
      const d=ev.data;
      if(ev.source!==frame.contentWindow||d?.type!=="ISO_EXPLORER_BATCH_DONE"||d.jobId!==job.jobId)return;
      cleanup();
      if(d.ok)resolve();else{const e=Error(d.error?.message||"並列バッチ処理に失敗しました。");e.stack=d.error?.stack||e.stack;reject(e)}
    };
    const cleanup=()=>{clearTimeout(timeout);window.removeEventListener("message",onMessage);for(const [id,rec] of parallelBatchWriters){if(rec.source===frame.contentWindow)parallelBatchWriters.delete(id)};frame.remove()};
    window.addEventListener("message",onMessage);
    document.body.appendChild(frame);
    frame.addEventListener("load",()=>{
      try{frame.contentWindow.postMessage({type:"ISO_EXPLORER_BATCH_RUN",jobId:job.jobId,iso:job.iso,base:job.base,directoryHandle:job.directoryHandle||null,nativeMode},"*")}catch(e){cleanup();reject(e)}
    },{once:true});
  });
}
async function runParallelBatch(list,makeJob,progressPrefix){
  let cursor=0,success=0,failed=0;
  const worker=async()=>{
    while(true){
      const index=cursor++;
      if(index>=list.length)return;
      const f=list[index];
      try{
        const job=await makeJob(f,index);
        await runParallelBatchJob(job);
        success++;log(`一括保存完了 [${index+1}/${list.length}]: ${progressPrefix(f)}`,"ok");
      }catch(err){
        failed++;log(`一括処理失敗 [${index+1}/${list.length}] ${progressPrefix(f)}: ${err.stack||err}`,"err");
      }
    }
  };
  const count=Math.min(PARALLEL_BATCH_LIMIT,list.length);
  log(`並列バッチ実行数: ${count}（安全のため各ISOを独立iframeで分離）`,"ok");
  await Promise.all(Array.from({length:count},()=>worker()));
  return {success,failed};
}

/* ---------------- UI ---------------- */
function wireUI(){
  const openBtn=$("open"), fileInput=$("file"), clearBtn=$("clear"), upBtn=$("up"), zipSelBtn=$("zipSel"), zipAllBtn=$("zipAll"), analysisBtn=$("analysis"), batchBtn=$("batch"), batchSource=$("batchSource"), drop=$("drop");
  if(!openBtn||!fileInput) throw new Error("UI初期化失敗: open/file要素が見つかりません");
  openBtn.addEventListener("click",()=>{
    try{fileInput.value=""; fileInput.click();}catch(e){log(`ファイル選択を開始できません: ${e.message||e}`,"err");}
  });
  fileInput.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0]; if(f) openISO(f);});
  clearBtn.addEventListener("click",()=>{iso=fsInfo=currentDir=selected=null;udfRuntimePartitions=[];udfRuntimeMaps=[];$("tree").innerHTML="";$("rows").innerHTML="";$("status").textContent="ISOが読み込まれていません。";$("log").textContent="";fileInput.value="";updateButtons();});
  upBtn.addEventListener("click",()=>{if(currentDir?.parent){currentDir=currentDir.parent;renderRows();renderMeta();updateButtons();}});
  zipSelBtn.addEventListener("click",async()=>{try{setBusy(true);await zipNodes([selected],iso.file.name.replace(/\.[^.]+$/,"")+"_"+selected.name.replace(/[\\/:*?"<>|]/g,"_")+".zip")}catch(e){log(e.stack||e,"err")}finally{setBusy(false);updateButtons()}});
  zipAllBtn.addEventListener("click",async()=>{try{setBusy(true);await zipNodes(fsInfo.root.children||[],iso.file.name.replace(/\.[^.]+$/g,"")+"_contents.zip",true)}catch(e){log(e.stack||e,"err")}finally{setBusy(false);updateButtons()}});
  analysisBtn.addEventListener("click",async()=>{try{setBusy(true);await analysisZip()}catch(e){log(e.stack||e,"err")}finally{setBusy(false);updateButtons()}});
  let batchDestinationHandle=null;
  batchBtn.addEventListener("click",async()=>{
    try{
      if(window.isoExplorerDesktop?.electron){
        const picked=await window.isoExplorerDesktop.pickBatchFolders();
        if(!picked||picked.canceled)return;
        const files=picked.files||[];
        const dest=picked.destination;
        if(!dest){
          log("保存先フォルダが選択されていません。","err");
          return;
        }
        const candidates=files.filter(f=>/\.(iso|img|bin)$/i.test(f.name));
        if(!candidates.length){
          log("選択フォルダ内にISO/IMG/BINがありません。","err");
          return;
        }
        const list=[];
        let skipped=0;
        for(const f of candidates){
          if(f.appleDouble){
            skipped++;
            log(`スキップ [AppleDouble sidecar]: ${f.relativePath}`,"warn");
          }else{
            list.push(f);
          }
        }
        if(!list.length){
          log(`一括処理対象なし: ${candidates.length} 個中 ${skipped} 個はAppleDouble sidecarでした。`,"warn");
          return;
        }

        setBusy(true);
        log(`一括保存開始: ${list.length} 個 / 読み込み元: ${picked.sourceName}`,"ok");
        log(`保存先: ${dest}`,"ok");

        const result=await runParallelBatch(list,(f,index)=>({
          jobId:`electron_${Date.now()}_${index}_${Math.random().toString(36).slice(2)}`,
          nativeMode:true,
          iso:{
            file:{name:f.name,size:f.size,nativePath:f.path,webkitRelativePath:f.relativePath},
            size:f.size,
            nativePath:f.path,
            nativeOutputRoot:dest,
            nativeOutputRelativeDir:(f.relativePath||"").split("/").slice(0,-1).join("/")
          },
          base:f.name.replace(/\.[^.]+$/i,""),
          directoryHandle:null
        }),f=>f.relativePath);
        log(`一括保存終了: 成功 ${result.success} / 失敗 ${result.failed} / 全 ${list.length}`,result.failed?"err":"ok");
        return;
      }

      if(!window.showDirectoryPicker || window.self!==window.top){
        log("この環境ではフォルダ一括保存を利用できません。EXE版ではElectronネイティブ選択を使用してください。","err");
        return;
      }
      batchDestinationHandle=await window.showDirectoryPicker({mode:"readwrite"});
      batchSource.value="";
      batchSource.click();
    }catch(e){
      batchDestinationHandle=null;
      if(e?.name!=="AbortError")log(e.stack||e,"err");
    }finally{
      setBusy(false);
      updateButtons();
    }
  });
  batchSource.addEventListener("change",async e=>{
    const candidates=[...(e.target.files||[])].filter(f=>/\.(iso|img|bin)$/i.test(f.name));
    const list=[];
    let skipped=0;
    for(const f of candidates){
      if(await isAppleDoubleFile(f)){skipped++;log(`スキップ [AppleDouble sidecar]: ${f.webkitRelativePath||f.name}`,"warn");}
      else list.push(f);
    }
    if(!candidates.length){batchDestinationHandle=null;log("選択フォルダ内にISO/IMG/BINがありません。","err");return;}
    const dest=batchDestinationHandle;
    batchDestinationHandle=null;
    if(!dest){log("保存先フォルダが選択されていません。もう一度実行してください。","err");return;}
    if(!list.length){log(`一括処理対象なし: ${candidates.length} 個中 ${skipped} 個はAppleDouble sidecarでした。`,"warn");batchSource.value="";return;}
    try{
      setBusy(true);
      const first=list[0].webkitRelativePath||list[0].name;
      const rootName=first.includes("/")?first.split("/")[0]:"ISO";
      log(`一括保存開始: ${list.length} 個 / 保存先ルート: ${rootName}`,"ok");
      const result=await runParallelBatch(list,(f,index)=>{
        const rel=f.webkitRelativePath||f.name;
        const parts=rel.split("/");parts.pop();
        return (async()=>{
          let dir=dest;
          for(const part of parts){if(!part)continue;dir=await dir.getDirectoryHandle(part,{create:true});}
          return {
            jobId:`browser_${Date.now()}_${index}_${Math.random().toString(36).slice(2)}`,
            nativeMode:false,
            iso:{file:f,size:f.size},
            base:f.name.replace(/\.[^.]+$/i,""),
            directoryHandle:dir
          };
        })();
      },f=>f.webkitRelativePath||f.name);
      log(`一括保存終了: 成功 ${result.success} / 失敗 ${result.failed} / 全 ${list.length}`,result.failed?"err":"ok");
    }catch(err){log(err.stack||err,"err")}
    finally{setBusy(false);updateButtons();batchSource.value=""}
  });
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>{const f=e.dataTransfer?.files?.[0];if(f)openISO(f)});
  window.addEventListener("error",e=>{try{log(`JavaScriptエラー: ${e.message||e.error||"unknown"}`,"err")}catch{}});
  window.addEventListener("unhandledrejection",e=>{try{log(`非同期エラー: ${e.reason?.stack||e.reason||"unknown"}`,"err")}catch{}});
  updateButtons();
}
wireUI();
GPU_ACCEL.init().then(ok=>{if(!ok)log(`GPUアクセラレーション: CPUモード (${GPU_ACCEL.reason})` ,"warn");});
</script>
</body>
